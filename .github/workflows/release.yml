name: Release

# Companion to RELEASE.md: builds the release artifacts when a version tag
# (v1.2.0) is pushed and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firefox:
    name: Firefox package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun run firefox:build
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: build/firefox-packages/*.zip
